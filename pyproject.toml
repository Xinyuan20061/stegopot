[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegopot"
version = "0.3.0"
description = "支持自定义拓扑、LLM 节点和隐写环境的多智能体实验框架。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
stego = [
  "numpy>=1.24",
  "torch>=2.1",
  "transformers>=4.40",
]

[tool.setuptools.packages.find]
include = ["stegopot", "stegopot.*"]
exclude = ["stegopot.tools.stego-kit*"]

[tool.pytest.ini_options]
testpaths = ["stegopot", "tests"]
