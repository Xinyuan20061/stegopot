[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegopot"
version = "0.6.0"
description = "配置驱动、插件可扩展、带信息隔离与审计的隐写实验框架。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6,<7", "packaging>=24,<27"]

[project.scripts]
stegopot = "stegopot.bootstrap.experiments.cli:main"

[project.optional-dependencies]
stego = [
  "numpy>=1.24",
  "torch>=2.1",
  "transformers>=4.40",
]

[tool.setuptools.packages.find]
include = ["stegopot", "stegopot.*"]
exclude = ["stegopot.infrastructure.vendor.stego-kit*"]

[tool.setuptools.package-data]
stegopot = ["infrastructure/vendor/stego-kit/**/*.py", "infrastructure/vendor/stego-kit/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["stegopot", "tests"]
