[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegopot"
version = "2.1.0"
description = "面向 LLM 隐写与多智能体研究的轻量级可控实验底座。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6,<7", "packaging>=24,<27"]

[project.scripts]
stegopot = "stegopot.bootstrap.experiments.cli:main"

[project.optional-dependencies]
whitebox = [
  "torch>=2.1",
  "transformers>=4.40",
  "safetensors>=0.4",
]
sae = [
  "torch>=2.4",
  "transformers>=4.40",
  "safetensors>=0.4",
  "sae-lens>=6,<7",
]
quantized = [
  "torch>=2.4",
  "transformers>=4.40",
  "safetensors>=0.4",
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
]
stego = [
  "numpy>=1.24",
  "torch>=2.1",
  "transformers>=4.40",
]

[tool.setuptools.packages.find]
include = ["stegopot", "stegopot.*"]
exclude = ["stegopot.infrastructure.vendor.stego-kit*"]

[tool.setuptools.package-data]
stegopot = ["infrastructure/vendor/stego-kit/**/*.py", "infrastructure/vendor/stego-kit/LICENSE*"]
