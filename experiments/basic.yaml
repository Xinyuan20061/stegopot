# 无需 API 密钥或扩展包的双节点通信实验。
schema_version: "1"
scenario:
  type: core.explicit
  config:
    task: 将状态消息发送给接收者。
    nodes:
      - id: sender
        policy:
          type: core.scripted
          config:
            actions:
              - kind: message
                target: receiver
                content: 状态正常
      - id: receiver
        policy: {type: core.echo}
    edges: [[sender, receiver]]
    max_rounds: 2
