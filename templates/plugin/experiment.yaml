schema_version: "1"
plugins: [example]
scenario:
  type: core.explicit
  config:
    task: 发送一条公开状态。
    nodes:
      - id: sender
        policy:
          type: core.scripted
          config:
            actions: [{kind: message, target: receiver, content: status-ok}]
      - id: receiver
        policy: {type: core.echo}
    edges: [[sender, receiver]]
rewards:
  - type: example.delivery
    config: {points: 2.0}
